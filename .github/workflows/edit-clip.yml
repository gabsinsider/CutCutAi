name: Editar corte
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      clip_id: {description: ID do corte, required: true, type: string}
      filter: {description: Filtro, default: none, type: choice, options: [none, vivid, cinematic, mono]}
      resolution: {description: Resolução, default: "1080", type: choice, options: ["720", "1080", "2160"]}
permissions: {contents: write, issues: write}
jobs:
  edit:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[EDIT]') || contains(github.event.issue.labels.*.name, 'edit-request')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Interpretar pedido
        id: request
        env: {BODY: "${{ github.event.issue.body }}", INPUT_ID: "${{ inputs.clip_id }}", INPUT_FILTER: "${{ inputs.filter }}", INPUT_RESOLUTION: "${{ inputs.resolution }}"}
        run: |
          python - <<'PY'
          import os,re
          body=os.environ.get('BODY','')
          def field(label,fallback):
              m=re.search(r'- '+re.escape(label)+r':\s*([^\n\r]+)',body,re.I); return m.group(1).strip() if m else fallback
          m=re.search(r'## Corte\s+([a-f0-9]{12})',body,re.I); clip=m.group(1) if m else os.environ.get('INPUT_ID','')
          if not re.fullmatch(r'[a-f0-9]{12}',clip): raise SystemExit('ID inválido')
          values={'clip':clip,'filter':field('Filtro',os.environ.get('INPUT_FILTER','none')),'resolution':field('Resolução',os.environ.get('INPUT_RESOLUTION','1080')),'caption_style':field('Legenda','none'),'caption_color':field('Cor','#FFFFFF'),'highlight_color':field('Destaque','#FFFF00'),'position':field('Posição','bottom'),'size':field('Tamanho','62'),'emphasis':field('Ênfase automática','sim')}
          values['filter']=values['filter'] if values['filter'] in {'none','vivid','cinematic','mono'} else 'none'
          values['resolution']=values['resolution'] if values['resolution'] in {'720','1080','2160'} else '1080'
          values['caption_style']=values['caption_style'] if values['caption_style'] in {'none','viral','clean'} else 'none'
          values['position']=values['position'] if values['position'] in {'top','center','bottom'} else 'bottom'
          values['emphasis']='yes' if values['emphasis'].lower() in {'sim','yes','true','1'} else 'no'
          values['caption_color']=values['caption_color'] if re.fullmatch(r'#[0-9a-fA-F]{6}',values['caption_color']) else '#FFFFFF'
          values['highlight_color']=values['highlight_color'] if re.fullmatch(r'#[0-9a-fA-F]{6}',values['highlight_color']) else '#FFFF00'
          try: values['size']=str(max(40,min(90,int(values['size']))))
          except ValueError: values['size']='62'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for k,v in values.items(): f.write(f'{k}={v}\n')
          PY
      - name: Baixar corte e legendas
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir -p work
          gh release download "clip-${{ steps.request.outputs.clip }}" --pattern "${{ steps.request.outputs.clip }}.mp4" --dir work
          gh release download "clip-${{ steps.request.outputs.clip }}" --pattern "${{ steps.request.outputs.clip }}.captions.json" --dir work || true
      - name: Renderizar escolhas do usuário
        run: >-
          PYTHONPATH=scripts python -m cutai.editor
          --source "work/${{ steps.request.outputs.clip }}.mp4"
          --output "work/${{ steps.request.outputs.clip }}-export-${{ github.run_id }}.mp4"
          --filter "${{ steps.request.outputs.filter }}"
          --resolution "${{ steps.request.outputs.resolution }}"
          --captions "work/${{ steps.request.outputs.clip }}.captions.json"
          --caption-style "${{ steps.request.outputs.caption_style }}"
          --caption-color "${{ steps.request.outputs.caption_color }}"
          --highlight-color "${{ steps.request.outputs.highlight_color }}"
          --caption-position "${{ steps.request.outputs.position }}"
          --caption-size "${{ steps.request.outputs.size }}"
          --auto-emphasis "${{ steps.request.outputs.emphasis }}"
      - name: Publicar exportação independente
        id: publish
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          CLIP="${{ steps.request.outputs.clip }}"
          TAG="export-${CLIP}-${{ github.run_id }}"
          FILE="${CLIP}-export-${{ github.run_id }}.mp4"
          gh release create "$TAG" "work/$FILE" --title "CutCutAi · Exportação · $CLIP" --notes "Exportação editada a partir do corte limpo $CLIP. O corte original permanece inalterado."
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$FILE"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'issues'
        env: {GH_TOKEN: "${{ github.token }}", EXPORT_URL: "${{ steps.publish.outputs.url }}"}
        run: gh issue comment "${{ github.event.issue.number }}" --body "Exportação concluída. O corte original foi preservado. Vídeo final: $EXPORT_URL"
