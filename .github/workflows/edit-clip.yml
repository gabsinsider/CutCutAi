name: Editar corte

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      clip_id: {description: ID do corte, required: true, type: string}
      filter: {description: "none, vivid, cinematic ou mono", default: none, type: choice, options: [none, vivid, cinematic, mono]}
      resolution: {description: Resolução vertical, default: "1080", type: choice, options: ["720", "1080", "2160"]}

permissions:
  contents: write
  issues: write

jobs:
  edit:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[EDIT]') || contains(github.event.issue.labels.*.name, 'edit-request')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Interpretar pedido
        id: request
        env:
          BODY: ${{ github.event.issue.body }}
          INPUT_ID: ${{ inputs.clip_id }}
          INPUT_FILTER: ${{ inputs.filter }}
          INPUT_RESOLUTION: ${{ inputs.resolution }}
        run: |
          python - <<'PY'
          import os,re
          body=os.environ.get('BODY','')
          def field(pattern, fallback):
              match=re.search(pattern,body,re.I)
              return match.group(1).strip() if match else fallback
          clip=field(r'## Corte\s+([a-f0-9]{12})',os.environ.get('INPUT_ID',''))
          filt=field(r'- Filtro:\s*(\w+)',os.environ.get('INPUT_FILTER','none'))
          res=field(r'- Resolução:\s*(\d+)',os.environ.get('INPUT_RESOLUTION','1080'))
          if not re.fullmatch(r'[a-f0-9]{12}',clip): raise SystemExit('ID inválido')
          if filt not in {'none','vivid','cinematic','mono'}: filt='none'
          if res not in {'720','1080','2160'}: res='1080'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'clip={clip}\nfilter={filt}\nresolution={res}\n')
          PY
      - name: Localizar e baixar corte
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release download "clip-${{ steps.request.outputs.clip }}" --pattern '*.mp4' --dir work
      - name: Renderizar
        run: PYTHONPATH=scripts python -m cutai.editor --source "work/${{ steps.request.outputs.clip }}.mp4" --output "work/${{ steps.request.outputs.clip }}-edited.mp4" --filter "${{ steps.request.outputs.filter }}" --resolution "${{ steps.request.outputs.resolution }}"
      - name: Publicar exportação
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release upload "clip-${{ steps.request.outputs.clip }}" "work/${{ steps.request.outputs.clip }}-edited.mp4" --clobber
      - if: github.event_name == 'issues'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh issue comment "${{ github.event.issue.number }}" --body "Exportação concluída e anexada ao Release do corte."
