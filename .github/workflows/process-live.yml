name: Processar live

on:
  issues:
    types: [opened, reopened, labeled]
  workflow_dispatch:
    inputs:
      live_url:
        description: Link da transmissão
        required: true
        type: string
      capture_seconds:
        description: Segundos nesta captura (60–900)
        required: false
        default: "180"
        type: string

concurrency:
  group: live-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  process:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[LIVE]') || contains(github.event.issue.labels.*.name, 'live-request')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -e '.[ai]'
          pip install 'yt-dlp[default,curl-cffi]'
      - name: Extrair link da Issue com segurança
        if: github.event_name == 'issues'
        id: issue
        run: python scripts/parse_issue.py
      - name: Resolver parâmetros
        id: params
        env:
          ISSUE_URL: ${{ steps.issue.outputs.url }}
          INPUT_URL: ${{ inputs.live_url }}
          INPUT_SECONDS: ${{ inputs.capture_seconds }}
        run: |
          URL="${INPUT_URL:-$ISSUE_URL}"
          SECONDS="${INPUT_SECONDS:-180}"
          if ! [[ "$SECONDS" =~ ^[0-9]+$ ]] || (( SECONDS < 60 || SECONDS > 900 )); then SECONDS=180; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"
      - name: Capturar, analisar e criar Top 3
        env:
          WHISPER_MODEL: tiny
          CUTAI_PROXY_URL: ${{ secrets.CUTAI_PROXY_URL }}
        run: python -m cutai.pipeline --url "${{ steps.params.outputs.url }}" --capture-seconds "${{ steps.params.outputs.seconds }}" --workdir work
      - name: Ler resultado
        id: result
        run: |
          echo "best_id=$(python -c 'import json;print(json.load(open("work/result.json"))["best_id"])')" >> "$GITHUB_OUTPUT"
          echo "count=$(python -c 'import json;print(json.load(open("work/result.json"))["count"])')" >> "$GITHUB_OUTPUT"
          echo "ids=$(python -c 'import json;print(" ".join(x["id"] for x in json.load(open("work/result.json"))["clips"]))')" >> "$GITHUB_OUTPUT"
      - name: Criar Releases e enviar mídias
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          result = json.load(open('work/result.json', encoding='utf-8'))
          repo = '${{ github.repository }}'
          for rank, clip in enumerate(result['clips'], 1):
              cid = clip['id']
              tag = f'clip-{cid}'
              notes = Path(f'work/{cid}-result.json')
              notes.write_text(json.dumps(clip, ensure_ascii=False, indent=2), encoding='utf-8')
              subprocess.run(['gh', 'release', 'create', tag, f'work/{cid}.mp4', f'work/{cid}.jpg', '--title', f'CutCutAi · Top {rank} · {cid}', '--notes-file', str(notes)], check=True)
              base = f'https://github.com/{repo}/releases/download/{tag}'
              subprocess.run(['python', 'scripts/update_release_metadata.py', '--ranking', 'data/ranking.json', '--clip', cid, '--asset-url', f'{base}/{cid}.mp4', '--thumbnail-url', f'{base}/{cid}.jpg', '--tag', tag], check=True)
          PY
      - name: Atualizar ranking
        run: |
          git config user.name "cutcutai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ranking.json
          git commit -m "data: adicionar Top ${{ steps.result.outputs.count }} cortes da live"
          git pull --rebase
          git push
      - name: Comentar resultado
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "Top **${{ steps.result.outputs.count }}** cortes concluídos. IDs: **${{ steps.result.outputs.ids }}**. O ranking foi atualizado no site."
